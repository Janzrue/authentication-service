server:
  port: 8081
spring:
  application:
    name: "authenticacion-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "authentication"
    schema: "public"
    username: "postgres"
    password: "admin"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

security:
  jwt:
    secret: "${JWT_SECRET:change_this_very_long_secret_key_32_chars_min}"
    access-token-validity-ms: 900000
    refresh-token-validity-ms: 86400000
logging:
  level:
    co.com.pragma.autenticacion: INFO
    org.springframework.security: INFO